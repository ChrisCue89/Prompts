<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompts zum Buch</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; color: #333; margin: 0; display: flex; justify-content: center; padding-top: 50px; }
        .hub-container { width: 90%; max-width: 500px; text-align: center; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; color: #007bff; }
        p { color: #666; margin-bottom: 30px; }
        .prompt-link { 
            display: block; 
            text-decoration: none; 
            background: #fff; 
            border: 2px solid #007bff; 
            color: #007bff; 
            padding: 15px; 
            margin-bottom: 15px; 
            border-radius: 10px; 
            font-weight: bold; 
            transition: all 0.3s;
        }
        .prompt-link:hover { background: #007bff; color: white; }
    </style>
</head>
<body>
    <div class="hub-container">
        <h1>Willkommen zu den Buch-Extras</h1>
        <p>Wähle hier das Kapitel aus, für das du den Prompt kopieren möchtest:</p>
        
        <a href="p1/" class="prompt-link">Kapitel 1: Der perfekte Start</a>
        <div style="margin-top: 40px; font-size: 0.8rem; color: #999; line-height: 1.5;">
    &copy; 2026 Christoph Gievers – Alle Prompts sind urheberrechtlich geschützt. <br>
    Die Vervielfältigung oder Weitergabe außerhalb des Buches ist nicht gestattet.
</div>
    </div>
</body>
</html>
