<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Kapitel 2</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f9f9fb; color: #1a1a1a; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .box { width: 100%; max-width: 450px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        h1 { font-size: 1.3rem; margin-bottom: 20px; }
        textarea { width: 100%; height: 180px; padding: 15px; border: 1px solid #ddd; border-radius: 12px; font-size: 0.95rem; background: #fafafa; resize: none; box-sizing: border-box; margin-bottom: 20px; }
        .copy-btn { background: #007bff; color: white; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .back-link { display: inline-block; margin-top: 20px; color: #007bff; text-decoration: none; font-size: 0.9rem; }
        footer { margin-top: 30px; font-size: 0.75rem; color: #aaa; line-height: 1.4; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Kapitel 2: Prompt</h1>
        <textarea id="pText" readonly>HIER DEINEN PROMPT TEXT FÜR KAPITEL 2 REINKOPIEREN</textarea>
        <button class="copy-btn" id="btn" onclick="copy()">Prompt kopieren</button>
        <br>
        <a href="../" class="back-link">← Zur Übersicht</a>
        
        <footer>
            &copy; 2026 Christoph Gievers – Urheberrechtlich geschützt.
        </footer>
    </div>

    <script>
        function copy() {
            var t = document.getElementById("pText");
            t.select();
            t.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(t.value);
            var b = document.getElementById("btn");
            b.innerText = "Kopiert! ✅";
            b.style.background = "#28a745";
            setTimeout(() => { b.innerText = "Prompt kopieren"; b.style.background = "#007bff"; }, 2000);
        }
    </script>
</body>
</html>
